name: Check
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      redis: {image: 'redis:7.4-alpine', ports: ['6379:6379']}
      postgres:
        image: postgres:17-alpine
        ports: ['5448:5432']
        env: {POSTGRES_USER: spool, POSTGRES_PASSWORD: spool-local, POSTGRES_DB: spool}
    env:
      SPOOL_TEST_REDIS: redis://localhost:6379/15
      SPOOL_TEST_DATABASE: postgres://spool:spool-local@localhost:5448/spool?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      # Installs the pnpm version pinned in apps/web/package.json. Corepack run
      # from the repository root would fetch the latest pnpm instead.
      - uses: pnpm/action-setup@v4
        with: {package_json_file: apps/web/package.json}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: make install
      - run: make api-check lint test build
      - run: cd apps/web && pnpm exec playwright install --with-deps chromium
      - run: cd apps/web && pnpm exec playwright test
