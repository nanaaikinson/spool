name: Check
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      redis: {image: 'redis:7.4-alpine', ports: ['6379:6379']}
      postgres:
        image: postgres:17-alpine
        ports: ['5448:5432']
        env: {POSTGRES_USER: spool, POSTGRES_PASSWORD: spool-local, POSTGRES_DB: spool}
    env:
      SPOOL_TEST_REDIS: redis://localhost:6379/15
      SPOOL_TEST_DATABASE: postgres://spool:spool-local@localhost:5448/spool?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: corepack enable
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: make api-check lint test build
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web exec playwright test
