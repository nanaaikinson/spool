# Optional private metrics storage, usable with either production Compose file.
services:
  app:
    environment:
      PROMETHEUS_URL: http://prometheus:9090
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      SPOOL_METRICS_TOKEN: ${SPOOL_METRICS_TOKEN:-}
    # The token stays out of the config and command line; legacy mode can omit it.
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        umask 077
        cat > /tmp/spool-prometheus.yml <<'CONFIG'
        global:
          scrape_interval: 15s
        scrape_configs:
          - job_name: spool
        CONFIG
        if [ -n "$$SPOOL_METRICS_TOKEN" ]; then
          printf '%s' "$$SPOOL_METRICS_TOKEN" > /tmp/spool-metrics-token
          printf '    authorization:\n      credentials_file: /tmp/spool-metrics-token\n' >> /tmp/spool-prometheus.yml
        fi
        printf '    static_configs:\n      - targets: ["app:8080"]\n' >> /tmp/spool-prometheus.yml
        exec /bin/prometheus --config.file=/tmp/spool-prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d
    volumes:
      - prometheus-data:/prometheus
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
volumes:
  prometheus-data:
