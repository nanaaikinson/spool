name: spool
services:
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6388:6379"]
    volumes: ["redis-data:/data"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9098:9090"]
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus-data:/prometheus"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  app:
    build: .
    ports: ["127.0.0.1:8088:8003"]
    environment:
      SPOOL_ADDR: 0.0.0.0:8003
      REDIS_URL: redis://redis:6379/0
      DATABASE_PATH: /data/spool.db
      PROMETHEUS_URL: http://prometheus:9090
      SPOOL_ADMIN_USER: admin
      SPOOL_ADMIN_PASSWORD: ${SPOOL_ADMIN_PASSWORD:-spool-local}
      SPOOL_SESSION_KEY: ${SPOOL_SESSION_KEY:-development-key-replace-before-production-12345}
      SPOOL_ENV: development
    volumes: ["spool-data:/data"]
    depends_on: {redis: {condition: service_healthy}}
  demo:
    build: .
    entrypoint: ["/app/spool-demo"]
    environment: {REDIS_URL: "redis://redis:6379/0"}
    depends_on: {redis: {condition: service_healthy}}
    profiles: [demo]
volumes:
  redis-data:
  spool-data:
  prometheus-data:
